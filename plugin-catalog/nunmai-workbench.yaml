description: The Nunmai desktop app in your browser. `nunmai workbench` serves the desktop interface through the Nunmai dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nunmai product. On the first `nunmai workbench` run and again after each Nunmai update it runs `npm install --ignore-scripts` (guided by Nunmai's lockfile) and Vite against your Nunmai checkout's desktop sources, writing only under ~/.nunmai/nunmai-workbench and its own plugin dir (the checkout is only read), and starts `nunmai dashboard` on loopback when none is running.
maintainer: sxuff
