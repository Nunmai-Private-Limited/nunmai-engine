name: Nunmai Plugin Validate
description: >-
  Validate a Nunmai Engine plugin (plugin.yaml manifest schema AND
  declared-vs-actually-registered capabilities) using
  `nunmai plugins validate`. Drop this into your plugin repo's CI:

    - uses: actions/checkout@<sha>
    - uses: Nunmai-Private-Limited/nunmai-engine/.github/actions/plugin-validate@main
      with:
        path: .

  The caller's job owns checkout; this action installs Python + nunmai-engine
  (git install — a supported CI-context install route) and runs the
  validator against your plugin directory.

inputs:
  path:
    description: Path to the plugin directory (containing plugin.yaml).
    default: "."
  nunmai-ref:
    description: nunmai-engine git ref (branch/tag/sha) to install and validate with.
    default: "main"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.11"

    - name: Install nunmai-engine
      shell: bash
      env:
        _NUNMAI_REF: ${{ inputs.nunmai-ref }}
      run: |
        set -euo pipefail
        # CI-context install from git; the ref lets plugin authors validate
        # against a pinned nunmai release instead of main.
        pip install "git+https://github.com/Nunmai-Private-Limited/nunmai-engine@${_NUNMAI_REF}"

    - name: Validate plugin
      shell: bash
      env:
        _PLUGIN_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail
        # `nunmai plugins validate` checks the plugin.yaml manifest schema
        # and loads the plugin in a scratch subprocess to verify that the
        # capabilities it DECLARES match what it actually registers.
        if nunmai plugins validate "$_PLUGIN_PATH"; then
          echo "✅ PASS: plugin at '$_PLUGIN_PATH' validated cleanly"
        else
          echo "❌ FAIL: plugin at '$_PLUGIN_PATH' failed validation (see output above)"
          exit 1
        fi
