# Lives in kube-system next to Traefik so it can be the default certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-wildcard
  namespace: kube-system
spec:
  secretName: platform-wildcard-tls
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
  dnsNames:
    - "platform.nunmai.in"
    - "*.platform.nunmai.in"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: platform-wildcard-tls
