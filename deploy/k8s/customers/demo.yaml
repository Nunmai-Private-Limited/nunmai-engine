# Example customer. Copy to <name>.yaml, fill secrets (or use --set / an existing Secret).
customer: demo
secrets:
  existingSecret: nunmai-demo-secrets   # kubectl -n cust-demo create secret generic nunmai-demo-secrets --from-literal=OPENROUTER_API_KEY=<portal key>
config:
  configYaml: |
    _config_version: 39     # current schema; without it the engine treats the file as legacy
    model:
      provider: custom
      base_url: http://litellm.nunmai-portal.svc.cluster.local:4000/v1
      default: nunmai-smart
  soulMd: |
    You are Demo Co's assistant. Be concise and friendly.
dashboard:
  enabled: true
  host: demo.platform.nunmai.in
  authSecret: nunmai-demo-dashboard   # kubectl -n cust-demo create secret generic nunmai-demo-dashboard --from-literal=NUNMAI_DASHBOARD_BASIC_AUTH_USERNAME=admin --from-literal=NUNMAI_DASHBOARD_BASIC_AUTH_PASSWORD=...
