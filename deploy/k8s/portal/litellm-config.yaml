# Provider keys come from the portal-provider-keys Secret (env vars).
# Same model_name on several entries = load-balanced "all brains at once";
# router_settings.fallbacks = what to try when one provider fails/rate-limits.
model_list:
  - model_name: nunmai-smart
    litellm_params: { model: anthropic/claude-sonnet-4.5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: nunmai-smart
    litellm_params: { model: openai/gpt-5.2, api_key: os.environ/OPENAI_API_KEY }
  - model_name: nunmai-smart
    litellm_params: { model: openrouter/anthropic/claude-sonnet-4.5, api_key: os.environ/OPENROUTER_API_KEY }

  - model_name: nunmai-fast
    litellm_params: { model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY }
  - model_name: nunmai-fast
    litellm_params: { model: openai/gpt-5-mini, api_key: os.environ/OPENAI_API_KEY }

  - model_name: nunmai-code
    litellm_params: { model: anthropic/claude-opus-4.5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: nunmai-code
    litellm_params: { model: openrouter/moonshotai/kimi-k2, api_key: os.environ/OPENROUTER_API_KEY }

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  fallbacks:
    - { nunmai-smart: [nunmai-fast] }
    - { nunmai-code:  [nunmai-smart] }

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
