apiVersion: v1
kind: Service
metadata: { name: litellm }
spec:
  selector: { app: litellm }
  ports: [{ name: http, port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: litellm }
spec:
  replicas: 1
  selector: { matchLabels: { app: litellm } }
  template:
    metadata:
      labels: { app: litellm }
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/config/litellm-config.yaml", "--port", "4000"]
          envFrom:
            - secretRef: { name: portal-provider-keys }
            - secretRef: { name: portal-master }
          env:
            - name: DATABASE_URL
              value: "postgresql://litellm:$(POSTGRES_PASSWORD)@postgres.nunmai-portal.svc.cluster.local:5432/litellm"
            - { name: STORE_MODEL_IN_DB, value: "True" }
          ports: [{ containerPort: 4000 }]
          readinessProbe:
            httpGet: { path: /health/readiness, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          volumeMounts: [{ name: config, mountPath: /config }]
      volumes:
        - name: config
          configMap: { name: litellm-config }
