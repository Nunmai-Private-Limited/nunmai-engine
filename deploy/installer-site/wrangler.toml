# Nunmai Engine installer host — serves install.sh / install.ps1
# Deploy:  npm run deploy   (runs build.sh, then wrangler deploy)
name = "nunmai-engine-installer"
compatibility_date = "2026-08-01"

# Custom domain: Cloudflare creates the DNS record + cert automatically
# because the zone nunmai.in is on this account.
routes = [
  { pattern = "nunmai-engine.nunmai.in", custom_domain = true }
]

[assets]
directory = "./public"
